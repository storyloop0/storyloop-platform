name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HARNESS_VERSION: "0.2.0"
  PYTHONPATH: ""
  PYTHONIOENCODING: utf-8
  STORY_MODEL_API_KEY: offline-test
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.25
      - name: Build harness from immutable metadata Git revision
        run: python scripts/build_harness.py --out-dir dist/harness
      - name: Install locked third-party platform dependencies
        run: |
          uv export --locked --all-extras --no-emit-project --no-emit-package storyloop-harness -o platform-requirements.txt
          python -m pip install --no-deps --require-hashes -r platform-requirements.txt
      - name: Consume pinned harness artifact and build platform independently
        run: |
          python -m pip install --no-deps --no-index --find-links dist/harness "storyloop-harness==${HARNESS_VERSION}"
          uv build --no-sources --wheel . --out-dir dist/platform
          python -m pip install --no-deps --no-index --find-links dist/platform storyloop-platform==0.1.0
          python -m pip check
      - name: Backend integration, package boundaries and isolated locked wheels
        run: python -I -m pytest tests -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-${{ matrix.os }}
          path: test-results.xml
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend dependencies
        if: runner.os == 'Linux'
        working-directory: web
        run: npm ci
      - name: Generated player contracts match Python
        if: runner.os == 'Linux'
        working-directory: web
        run: npm run contracts:check
      - name: Cross-language player contracts
        if: runner.os == 'Linux'
        run: python tests/player_contract_corpus.py
      - name: Frontend tests and build
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          npm test
          npm run build
      - name: Browser interactions
        if: runner.os == 'Linux'
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Local player acceptance
        if: runner.os == 'Linux'
        working-directory: web
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: failure() && runner.os == 'Linux'
        with:
          name: browser-failures
          path: web/test-results/
